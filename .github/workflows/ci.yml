name: GravityAI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync Virtualenv & Dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Safety Check (Dependencies)
        run: |
          uv pip install safety
          uv run safety check --ignore 70612 || true

      - name: Run Security Audit (Bandit)
        run: |
          uv pip install bandit
          uv run bandit -r backend/ -x tests/ -ll

      - name: Run Dependency Audit (pip-audit)
        run: |
          uv pip install pip-audit
          uv run pip-audit --local || true

      - name: Run Deploy Readiness Validation
        run: |
          export PYTHONPATH="."
          uv run python scripts/verify_readiness.py

      - name: Run Pytest Suite
        run: |
          # Set mock environment variables for tests
          export APP_ENV=development
          export GEMINI_API_KEY=mock-api-key
          export SUPABASE_URL=https://mock.supabase.co
          export SUPABASE_ANON_KEY=mock-anon
          export SUPABASE_SERVICE_ROLE_KEY=mock-service
          export PYTHONPATH="."
          uv run pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: gravityai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: gravityai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
