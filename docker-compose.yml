version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gravityai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    networks:
      - gravityai_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gravityai_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
    networks:
      - gravityai_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  gravityai_network:
    driver: bridge
