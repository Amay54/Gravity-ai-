[project]
name = "gravityai"
version = "0.1.0"
description = "Enterprise AI Research Operating System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "streamlit>=1.36.0",
    "streamlit-extras>=0.4.3",
    "watchdog>=4.0.1",
    "supabase>=2.5.1",
    "postgrest>=0.16.2",
    "agno>=1.0.0",
    "langgraph>=0.1.5",
    "google-genai",
    "reportlab>=4.2.2",
    "fpdf2>=2.7.9",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=4.9.4",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "matplotlib>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (needed for fastapi Depends)
    "ARG002", # unused method argument (mock connectors interface)
    "ARG003", # unused class method argument
    "E402", # module level import not at top of file
    "F841", # local variable assigned but never used
    "F401", # unused imports (package init files)
    "B904", # raise inside except without from
    "B007", # loop control variable not used
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["backend", "frontend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = false
